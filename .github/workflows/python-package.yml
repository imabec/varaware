name: varaware-package-checks

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        run: pip install -e .

      - name: Import test
        run: |
          python -c "from varaware.models import StateCoupledSV"
          python -c "from varaware.simulations import SCSVSimulator"

      - name: Basic simulation test
        run: |
          python - <<EOF
          from varaware.simulations import SCSVSimulator
          from varaware.models import StateCoupledSV

          df = simulate_scsv(T=100)

          y = df["y"].values

          model = StateCoupledSV(
              n_particles=200,
              n_paths=50,
              max_iter=2
          )

          model.fit(y)

          print(model.summary())
          EOF
